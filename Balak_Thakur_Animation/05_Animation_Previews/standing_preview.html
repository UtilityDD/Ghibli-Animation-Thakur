<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Standing poses — one dhoti</title>
  <style>
    body { margin: 0; background: #1c1917; color: #f5f0e6; font: 16px/1.4 Georgia, serif; }
    h1 { font-weight: normal; font-size: 22px; margin: 28px 32px 8px; }
    p { margin: 0 32px 24px; color: #d6cfc3; max-width: 760px; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; padding: 0 32px 40px; }
    figure { margin: 0; }
    img { width: 320px; height: 320px; background: #f7f3e8; border-radius: 8px; }
    figcaption { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>One dhoti, every standing pose</h1>
  <p>The same white dhoti is worn like a sari, over one shoulder and across the chest. Arms are bare. Each clip is a different pose.</p>
  <div class="row">
    <figure>
      <img src="GIF/THAKUR_STANDING_IDLE_V001.gif?v=7" alt="Standing idle">
      <figcaption>Standing idle</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_TURN_AROUND_V001.gif?v=7" alt="Turn around">
      <figcaption>Turn around — front, three-quarter, both profiles, rear</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_WALK_CYCLE_V001.gif?v=7" alt="Walk">
      <figcaption>Walk</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_WALK_SLOW_CYCLE_V001.gif?v=7" alt="Slow walk">
      <figcaption>Slow walk</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_RUN_CYCLE_V001.gif?v=7" alt="Run">
      <figcaption>Run</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_JUMP_V001.gif?v=7" alt="Jump">
      <figcaption>Jump</figcaption>
    </figure>
    <figure>
      <img src="GIF/THAKUR_MOVING_FORWARD_BACKWARD_V001.gif?v=7" alt="Forward and back">
      <figcaption>Forward and back</figcaption>
    </figure>
  </div>
</body>
</html>

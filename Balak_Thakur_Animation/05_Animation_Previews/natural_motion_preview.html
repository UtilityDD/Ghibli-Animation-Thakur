<!DOCTYPE html>

  <meta charset="utf-8">
  <title>More detailed motion</title>
  <style>
    body { margin: 0; background: #1c1917; color: #f5f0e6; font: 16px/1.4 Georgia, serif; }
    h1 { font-weight: normal; font-size: 22px; margin: 28px 32px 8px; }
    h2 { font-weight: normal; font-size: 18px; margin: 8px 32px 12px; color: #e7dcc8; }
    p { margin: 0 32px 20px; color: #d6cfc3; max-width: 820px; }
    .row { display: flex; flex-wrap: wrap; gap: 22px; padding: 0 32px 28px; }
    figure { margin: 0; width: 240px; }
    img { width: 240px; height: 240px; background: #f7f3e8; border-radius: 8px; }
    figcaption { margin-top: 6px; font-size: 14px; }
  </style>

<body>
  <h1>More frames, easier motion</h1>
  <p>Each gesture now travels over 24 in-between drawings. The walk has 96 frames, the slow walk 144, and the run 64, so the steps ease instead of popping.</p>

  <h2>Kneeling, sitting down, standing up</h2>
  <div class="row">
    <figure><img src="GIF/THAKUR_KNEELING_V001.gif?v=14" alt="Kneeling"><figcaption>Kneeling, 72 frames</figcaption></figure>
    <figure><img src="GIF/THAKUR_SITTING_DOWN_V001.gif?v=14" alt="Sitting down"><figcaption>Sitting down, 72 frames</figcaption></figure>
    <figure><img src="GIF/THAKUR_STANDING_UP_V001.gif?v=14" alt="Standing up"><figcaption>Standing up, 72 frames</figcaption></figure>
  </div>

    <figure><img src="GIF/THAKUR_RUN_CYCLE_V001.gif?v=14" alt="Run"><figcaption>Run, 64 frames</figcaption></figure>
    <figure><img src="GIF/THAKUR_JUMP_V001.gif?v=14" alt="Jump"><figcaption>Jump, 72 frames</figcaption></figure>
    <figure><img src="GIF/THAKUR_TURN_AROUND_V001.gif?v=14" alt="Turn"><figcaption>Turn, 120 frames</figcaption></figure>
